name: Build peridot msm_drm + DLKM

# Rebuild of the kernel / driver stack for Xiaomi Redmi Turbo 3 (peridot,
# Qualcomm SM8635, Android 14).
#
# Provenance: this workflow + build.sh are recovered from the run-logs of the
# now-suspended `hoshikv/peridot-kernel-build` repo (see ../kernelsrc/08).
# build.sh is the ORIGINAL script, unmodified except for sourcing the display,
# touch and audio techpacks from GuidixX's modules repo instead of three
# separate hoshikv checkouts that are no longer reachable, and for letting
# DISPLAY_URL/DISPLAY_REF point the display techpack at a pinned hoshikv
# commit (FOD-HBM rebuild). When DISPLAY_URL is set it wins over the
# display-drivers inside the modules repo.
#
# Every input repo here is PUBLIC, so no secrets are required.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # must match the kernel that is flashed on the device, else vermagic/CRC differ
  # and vendor_dlkm modules refuse to load
  KMI: 6.1.175-android14-11-ga3b9c44908dd-ab13320413
  KERNEL_REPO: GuidixX/kernel_xiaomi_sm8635
  KERNEL_BRANCH: "16.2"
  MODULES_BRANCH: "16.2"
  # hoshikv FOD-HBM display techpack, pinned to one commit so msm_drm.ko is
  # reproducible. build.sh clones this itself and it overrides the GuidixX
  # display-drivers that ship inside the modules repo.
  DISPLAY_URL: "https://github.com/kvfsrl/vendor_opensource_display-drivers-peridot.git"
  DISPLAY_REF: "d09ccf08d27862109e981b5bd079142fcf3e7c88"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      # GuidixX 16.2 ships SUBLEVEL 174; build.sh bumps it to 175 so the module
      # CRC/vermagic matches the flashed kernelxc kernel.
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: GuidixX/kernel_xiaomi_sm8635
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 0

      - name: Checkout frameboost driver
        uses: actions/checkout@v4
        with:
          repository: kvfsrl/vendor_frameboost-drivers
          ref: main
          path: frameboost-drivers

      - name: Checkout hybridswap driver
        uses: actions/checkout@v4
        with:
          repository: kvfsrl/vendor_oplus-hybridswap-driver
          ref: main
          path: hybridswap-driver

      - name: Checkout haptic driver
        uses: actions/checkout@v4
        with:
          repository: kvfsrl/vendor_opensource-haptic-driver-peridot
          ref: main
          path: haptic-drivers

      - name: Checkout oplus missing drivers
        uses: actions/checkout@v4
        with:
          repository: kvfsrl/vendor_oplus-missing-drivers
          ref: main
          path: oplus-missing-drivers

      - name: Verify sources
        run: |
          set -euo pipefail
          for d in kernel frameboost-drivers hybridswap-driver haptic-drivers; do
            test -d "$d/.git" || { echo "MISSING: $d"; exit 1; }
            printf '%-20s %s\n' "$d" "$(git -C "$d" rev-parse HEAD)"
          done

      - name: Collect source SHAs
        run: |
          {
            echo "KERNEL_SHA=$(git -C kernel rev-parse HEAD)"
            echo "FB_SHA=$(git -C frameboost-drivers rev-parse HEAD)"
            echo "HS_SHA=$(git -C hybridswap-driver rev-parse HEAD)"
            echo "HAPTIC_SHA=$(git -C haptic-drivers rev-parse HEAD)"
          } | tee -a "$GITHUB_ENV"

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            python3 git ccache lz4 zip

      # Toolchain note: the original build used AOSP clang-r530567
      # (android.googlesource.com). That host now answers 503 to the
      # /+archive/ tarball endpoint, and a depth-1 git clone of the prebuilts
      # repo is multi-GB and dies with "early EOF".
      # clang-r530567 is LLVM 17.0.x, so clang-17 from apt.llvm.org is the
      # same major version and builds this GKI 6.1 tree identically.
      # build.sh already passes -Wno-error, so new warnings cannot break it.
      - name: Set up clang 17
        run: |
          set -euo pipefail
          sudo apt-get install -y wget gnupg lsb-release software-properties-common
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/llvm.gpg >/dev/null
          CODENAME="$(lsb_release -cs)"
          echo "deb http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-17 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y clang-17 lld-17
          /usr/lib/llvm-17/bin/clang --version
          test -x /usr/lib/llvm-17/bin/llvm-strip

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: peridot-kernel-build
          max-size: 8G
          restore: true
          verbose: 0
          variant: ccache
          save: true
          append-timestamp: true
          create-symlink: false
          job-summary: CCache Statistics
          update-package-index: false

      - name: Build
        env:
          CLANG_DIR: /usr/lib/llvm-17
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          MODULES_BRANCH: ${{ env.MODULES_BRANCH }}
          DISPLAY_URL: ${{ env.DISPLAY_URL }}
          DISPLAY_REF: "d09ccf08d27862109e981b5bd079142fcf3e7c88"
        run: bash build.sh

      - name: Summary
        if: always()
        run: |
          echo "### out/" >> "$GITHUB_STEP_SUMMARY"
          ls -la out/ 2>/dev/null >> "$GITHUB_STEP_SUMMARY"
          echo "### .ko" >> "$GITHUB_STEP_SUMMARY"
          find out -name '*.ko' 2>/dev/null | sort >> "$GITHUB_STEP_SUMMARY"

      - name: Upload kernel + all modules
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peridot-kernel-${{ github.run_id }}
          path: |
            out/Image
            out/Image.gz
            out/msm_drm.ko
            out/qti_battery_charger.ko
            out/vendor_dlkm/**
            out/touch_modules/*.ko
            out/audio_modules/*.ko
            out/haptic_modules/*.ko
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build logs (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: out/*.log
          if-no-files-found: ignore
          retention-days: 7

      # Build-state to rebuild msm_drm.ko (touch/audio too) OUT-OF-TREE without
      # rerunning the full vmlinux+modules pass: kernel Module.symvers + config +
      # generated headers + companion modules' symvers. Restore into a checkout at
      # the SAME kernel SHA, then run fastbuild.sh (display-only `M=` step).
      - name: Stage hidden config for artifact
        if: always()
        run: cp out/.config out/kbuild.config
      - name: Upload build state (fast out-of-tree rebuild)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildstate-peridot-kernel-${{ github.run_id }}
          path: |
            out/.config
            out/kbuild.config
            out/Module.symvers
            out/vmlinux.symvers
            out/walt-extra.symvers
            out/kernel-sha
            out/kernel/sched/walt/Module.symvers
            out/include/**
            out/arch/arm64/include/**
            out/scripts/**
            modules/qcom/opensource/mm-drivers/sync_fence/Module.symvers
            modules/qcom/opensource/mm-drivers/hw_fence/Module.symvers
            modules/qcom/opensource/mm-drivers/msm_ext_display/Module.symvers
            modules/qcom/opensource/mmrm-driver/driver/Module.symvers
            modules/qcom/opensource/securemsm-kernel/Module.symvers
            display-drivers/Module.symvers
          if-no-files-found: warn
          retention-days: 14
